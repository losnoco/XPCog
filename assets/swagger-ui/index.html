<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XPCog remote control</title>
<link rel="stylesheet" href="/docs/swagger-ui.css">
<style>
  body { margin: 0; font-family: system-ui, sans-serif; }
  #token-bar {
    display: flex; gap: .5rem; align-items: center; flex-wrap: wrap;
    padding: .75rem 1rem; background: #1b1b1b; color: #eee;
  }
  #token-bar input {
    flex: 1 1 22rem; min-width: 12rem; padding: .4rem .5rem;
    font-family: ui-monospace, monospace; border: 1px solid #444;
    border-radius: 3px; background: #111; color: #eee;
  }
  #token-bar button {
    padding: .4rem .9rem; border: 0; border-radius: 3px;
    background: #4a7; color: #061; font-weight: 600; cursor: pointer;
  }
  #token-bar button.secondary { background: #333; color: #ddd; }
  #token-note { flex-basis: 100%; font-size: .85rem; color: #aaa; }
</style>
</head>
<body>

<!--
  The token bar exists because a browser cannot put an Authorization header on a
  top-level navigation. This page and its two assets are therefore the only
  unauthenticated things the server serves; everything the page can actually do
  needs the token typed in here.

  localStorage rather than sessionStorage: a token that had to be pasted in again
  for every tab sent the reader back to the preferences pane to copy it each time,
  and that friction is what makes a credential end up somewhere worse. The store
  is per-origin -- only a page served by this player can read it -- and "Forget"
  empties it.
-->
<div id="token-bar">
  <label for="token">Access token</label>
  <input id="token" type="password" autocomplete="off" spellcheck="false"
         placeholder="Preferences -> Remote -> Access token">
  <button id="apply" type="button">Use</button>
  <button id="forget" type="button" class="secondary">Forget</button>
  <span id="token-note">Remembered in this browser until you forget it. Sent as a
    bearer token with every request, including the one that fetches this page's own
    specification. A server set to skip the token for this computer needs none of
    it.</span>
</div>

<div id="swagger-ui"></div>

<script src="/docs/swagger-ui-bundle.js"></script>
<!--
  A file rather than an inline block: this page is served with `script-src
  'self'`, which blocks inline execution. See docs.js.
-->
<script src="/docs/docs.js"></script>
</body>
</html>
