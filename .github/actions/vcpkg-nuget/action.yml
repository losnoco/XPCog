name: Connect vcpkg to the binary cache
description: >-
  Registers the GitHub Packages NuGet registry with the nuget.exe that vcpkg
  uses, so that the nuget source named in VCPKG_BINARY_SOURCES can be read and
  written. Run after lukka/run-vcpkg, which sets VCPKG_ROOT.

# The feed is https://nuget.pkg.github.com/<owner>/index.json, and vcpkg
# talks to it through nuget.exe -- its own copy, which `vcpkg fetch nuget`
# downloads and whose path it prints. On Windows that runs as it is; on Linux
# and macOS it is a .NET Framework executable and runs under mono, which
# neither ubuntu-24.04 nor the macOS images ship any more, so it is installed
# here. About a minute on each, against the twenty to seventy that a cold
# rebuild of the ports costs.
#
# Two registrations, and both are needed: `sources add` is what nuget consults
# to download, `setapikey` is what it sends to upload. The password is stored
# in clear text in nuget's own config on the runner, which is what
# -StorePasswordInClearText grants; mono's nuget cannot encrypt it and the
# runner is discarded with the job.
#
# On Apple Silicon, lukka/run-vcpkg exports VCPKG_FORCE_SYSTEM_BINARIES=1 for
# every later step, and vcpkg reads that as "set" even when empty, so it can
# only be undone inside a shell. With it set, `vcpkg fetch nuget` refuses to
# download nuget.exe and the NuGet provider would look for a system `nuget`
# instead -- and then run it under mono, which Homebrew's `nuget`, a shell
# script around the real thing, is not. So it is unset here, and again in
# ci.yml's macOS configure steps, where vcpkg runs the provider. Nothing on the
# runner needed it: at the pinned baseline vcpkg's own cmake and ninja for
# macOS are universal binaries.
#
# The token is the workflow's GITHUB_TOKEN, given packages:write at the top of
# ci.yml. On a pull request from a fork it is read-only, and then vcpkg reads
# the feed, fails to upload what it built, says so, and carries on: the build
# is not gated on the cache.

inputs:
  token:
    description: >-
      A token with packages:read, and packages:write for the uploads.
    required: true

runs:
  using: composite
  steps:
    - name: Install mono, for nuget.exe
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get install -y --no-install-recommends mono-complete

    - name: Install mono, for nuget.exe
      if: runner.os == 'macOS'
      shell: bash
      run: brew install mono

    - name: Register the feed
      shell: bash
      env:
        OWNER: ${{ github.repository_owner }}
        FEED: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        TOKEN: ${{ inputs.token }}
      run: |
        unset VCPKG_FORCE_SYSTEM_BINARIES
        nuget="$("$VCPKG_ROOT/vcpkg" fetch nuget | tail -n 1)"
        if [ "$RUNNER_OS" = "Windows" ]; then
          run=("$nuget")
        else
          run=(mono "$nuget")
        fi
        "${run[@]}" sources add \
          -Source "$FEED" \
          -StorePasswordInClearText \
          -Name GitHubPackages \
          -UserName "$OWNER" \
          -Password "$TOKEN"
        "${run[@]}" setapikey "$TOKEN" -Source "$FEED"
