name: Connect vcpkg to the binary cache
description: >-
  Points vcpkg's binary caching at the Cloudflare R2 bucket, through the AWS
  CLI the runner images already carry, or on a self-hosted runner at a
  directory on its own disk. With no credentials on a hosted runner it leaves
  vcpkg to build from source and says so.

# The cache is an S3-compatible bucket on Cloudflare R2, and vcpkg reaches it
# with its `x-aws` provider: `aws s3 ls` to ask whether a package is there,
# `aws s3 cp` to fetch or store it, one object per port named by its ABI hash.
# That is on GitHub's hosted runners. On a self-hosted runner this points vcpkg
# at a directory on the machine's own disk instead; the step below says why.
# Nothing is installed for it -- the AWS CLI is on the hosted images -- and
# nothing expires it. Objects accumulate: a compiler update on a runner
# image adds one platform's worth of new ABIs, a few hundred megabytes, and
# the old ones stay. That is deliberate; R2 gives ten gigabytes before it
# charges, and a lifecycle rule that deleted by age would also delete the
# packages still in use, since a restore never rewrites the object. If the
# bucket ever needs pruning, the objects a run used are the ABIs in each
# build tree's vcpkg_installed/vcpkg/status; everything else is stale.
#
# R2 speaks S3 with three differences the CLI has to be told about: the
# endpoint is the account's rather than Amazon's, the region is the word
# `auto`, and the checksums the CLI has computed on every upload since 2.23
# are not something R2 accepts, so they are limited to where the request
# demands one. All of it goes through the environment, into GITHUB_ENV, so
# that the configure step's vcpkg inherits it.
#
# The retry settings are there because a read that fails is *silent*. vcpkg
# runs one `aws` per package and reads its exit status only as "cached" or
# "not cached", so a throttled or dropped read is indistinguishable from a
# package that was never uploaded: the job rebuilds it from source, uploads it
# over the copy already there, and says nothing. On 2026-09-17 that cost both
# Windows jobs about forty minutes each -- 3 packages restored out of 58, with
# the same compiler, the same baseline and the same 58 versions as the run
# twenty hours before it, which had restored all 58. Nothing had invalidated;
# the reads had simply failed.
#
# The CLI on the hosted images is v2 (2.36.40 at the time of writing), whose
# defaults are already `standard` retries -- throttling, 5xx and transient
# connection errors -- but only **three attempts**. So what changes here is
# mostly the headroom: ten attempts of exponential backoff before a read is
# called a miss. The mode is pinned alongside it rather than left implicit,
# because it is the CLI's default and not a promise: v1's default was `legacy`,
# which does not retry a throttle at all, and an image that shipped one would
# fail this way again with nothing to point at.
#
# What this does not do is make a miss *visible*. vcpkg still reports only the
# count it restored, and only in the configure log, which most jobs do not
# keep. Reading "Restored N package(s)" against the number it was about to
# install is the check worth having, and it wants the Configure step to tee.
#
# The credentials are repository secrets, which a pull request from a fork
# does not receive. Then this step sets nothing and exits cleanly, and vcpkg
# falls back to its default local cache, which on a fresh runner is empty: the
# build takes the long way and is otherwise the same build. A bucket that the
# credentials cannot list is reported here, in seconds, rather than as an
# hour of silent rebuilding followed by a failed upload.

inputs:
  access-key-id:
    description: The R2 API token's access key id.
    required: false
  secret-access-key:
    description: The R2 API token's secret access key.
    required: false
  endpoint:
    description: The account's S3 endpoint, https://<account id>.r2.cloudflarestorage.com
    required: false
  bucket:
    description: The bucket name.
    required: false
    default: xpcog-vcpkg

runs:
  using: composite
  steps:
    - name: Point vcpkg at the bucket
      shell: bash
      env:
        ACCESS_KEY_ID: ${{ inputs.access-key-id }}
        SECRET_ACCESS_KEY: ${{ inputs.secret-access-key }}
        ENDPOINT: ${{ inputs.endpoint }}
        BUCKET: ${{ inputs.bucket }}
        RUNNER_ENVIRONMENT: ${{ runner.environment }}
      run: |
        # A self-hosted runner keeps its disk, so it caches into a directory
        # there instead of the bucket: the same archives, no network, and no
        # R2 credentials on a machine that is not GitHub's.
        #
        # It has to be said explicitly, because lukka/run-vcpkg does not leave
        # vcpkg's default alone. It sets VCPKG_BINARY_SOURCES to
        # `clear;x-gha,readwrite` -- `clear` drops the default local cache and
        # x-gha is a backend vcpkg has since removed -- and points
        # VCPKG_DEFAULT_BINARY_CACHE at a fresh GUID-named directory per job.
        # Left as it is, nothing is cached at all: the first self-hosted run
        # rebuilt all 47 ports in the installer job and again in the Windows
        # job, on the same machine, an hour apart.
        #
        # The directory is vcpkg's own default location, under the runner
        # account's profile: outside the workspace, so a checkout's clean never
        # touches it. It only grows; prune it on the machine if the disk fills.
        if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then
          if [ -n "${LOCALAPPDATA:-}" ]; then
            archives=$(cygpath -m "$LOCALAPPDATA")/vcpkg/archives
          else
            archives=${XDG_CACHE_HOME:-$HOME/.cache}/vcpkg/archives
          fi
          mkdir -p "$archives"
          echo "Binary cache: $archives (self-hosted runner, local disk), $(ls "$archives" | wc -l) entries"
          echo "VCPKG_BINARY_SOURCES=clear;files,$archives,readwrite" >> "$GITHUB_ENV"
          exit 0
        fi

        if [ -z "$ACCESS_KEY_ID" ] || [ -z "$SECRET_ACCESS_KEY" ] || [ -z "$ENDPOINT" ]; then
          echo "::notice::No binary cache credentials (a pull request from a fork, or the R2 secrets are unset): vcpkg builds every dependency from source."
          exit 0
        fi
        if ! command -v aws >/dev/null; then
          echo "::error::The AWS CLI is not on this runner, and vcpkg's x-aws provider needs it."
          exit 1
        fi

        export AWS_ACCESS_KEY_ID="$ACCESS_KEY_ID"
        export AWS_SECRET_ACCESS_KEY="$SECRET_ACCESS_KEY"
        export AWS_ENDPOINT_URL="$ENDPOINT"
        export AWS_DEFAULT_REGION=auto
        export AWS_REQUEST_CHECKSUM_CALCULATION=when_required
        export AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
        export AWS_RETRY_MODE=standard
        export AWS_MAX_ATTEMPTS=10

        # Fail here if the bucket cannot be listed; a wrong secret is cheaper
        # to learn about now.
        aws s3 ls "s3://$BUCKET/" >/dev/null
        echo "Binary cache: s3://$BUCKET/ at $ENDPOINT, $(aws --version)"

        {
          echo "VCPKG_BINARY_SOURCES=clear;x-aws,s3://$BUCKET/,readwrite"
          echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID"
          echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY"
          echo "AWS_ENDPOINT_URL=$AWS_ENDPOINT_URL"
          echo "AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION"
          echo "AWS_REQUEST_CHECKSUM_CALCULATION=$AWS_REQUEST_CHECKSUM_CALCULATION"
          echo "AWS_RESPONSE_CHECKSUM_VALIDATION=$AWS_RESPONSE_CHECKSUM_VALIDATION"
          echo "AWS_RETRY_MODE=$AWS_RETRY_MODE"
          echo "AWS_MAX_ATTEMPTS=$AWS_MAX_ATTEMPTS"
        } >> "$GITHUB_ENV"
