name: Cache keepalive

# Touches the vcpkg binary caches so that a quiet fortnight does not throw
# them away.
#
# GitHub evicts any Actions cache entry that has not been accessed for seven
# days, on top of the 10 GB per-repository cap. Nine days between pushes was
# enough for every `vcpkg-v3-*` entry to go: the run for 1.9.0 found zero
# caches and every job built its dependencies from source, twenty minutes a
# job in place of five. A restore counts as an access, so this restores each
# key on a schedule and does nothing else with it.
#
# Twice a week rather than once: with one visit a week a delayed or failed
# run leaves the next one past the seven days, and the point is never to be.
#
# One job per key, on the runner that wrote it. A cache entry is matched by
# key *and* by a version derived from the path and the compression tool, and
# those differ between the three operating systems, so a restore from the
# wrong one is a miss that touches nothing. The keys are the ones ci.yml
# uses, with the same hashFiles() and the same runner image, so an exact hit
# is found where there is one and the prefix finds the newest otherwise --
# either way the entry a real run would use is the one kept alive.
#
# Kept apart from ci.yml so that it shares neither its concurrency group nor
# its triggers: a keepalive run must never cancel a build, and a push must
# never wait on one.

on:
  schedule:
    # 06:00 UTC on Mondays and Thursdays.
    - cron: "0 6 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  touch:
    name: ${{ matrix.key }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            key: linux-debug
          - os: ubuntu-24.04
            key: linux-release
          - os: ubuntu-24.04
            key: linux-repo
          - os: ubuntu-24.04
            key: linux-headless
          - os: windows-2022
            key: windows-debug
          - os: windows-2022
            key: windows-app-release
          - os: macos-26
            key: macos-debug
          - os: macos-26
            key: macos-app-release
    steps:
      # For hashFiles(): the exact key is a hash of the manifest and the ports
      # as they are on main.
      - uses: actions/checkout@v4

      # The image is part of the key, as in ci.yml, and for the same reason.
      - name: Name the runner image
        id: image
        shell: bash
        run: echo "version=${ImageVersion:-unversioned}" >> "$GITHUB_OUTPUT"

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-v3-${{ matrix.key }}-${{ steps.image.outputs.version }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ports/**', 'triplets/**', 'cmake/XPCogOsxTriplet.cmake', 'cmake/XPCogOsxDeploymentTarget.cmake', 'CMakePresets.json') }}
          restore-keys: |
            vcpkg-v3-${{ matrix.key }}-${{ steps.image.outputs.version }}-
            vcpkg-v3-${{ matrix.key }}-

      # Said out loud, because a miss here is not a failure of this workflow:
      # it means the entry was already gone, or was never written, and the
      # next real run will write it. Nothing to do about it here.
      - name: Report
        shell: bash
        run: |
          if [ -n "${{ steps.vcpkg-cache.outputs.cache-matched-key }}" ]; then
            echo "Touched ${{ steps.vcpkg-cache.outputs.cache-matched-key }}"
          else
            echo "::warning::No cache found for vcpkg-v3-${{ matrix.key }}-; the next CI run will write one"
          fi
