name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_DISABLE_METRICS: "1"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # A hung job is not a slow job, and GitHub's default lets it run for six
    # hours before saying so. A green run here is five to eight minutes on a warm
    # binary cache and around twenty on a cold one, so an hour is generous enough
    # never to cut off real work and short enough that a wedged runner reports
    # rather than idles.
    #
    # Added after one Linux job stalled three times in a row: seven minutes in
    # `apt-get update` against an unreachable azure.archive.ubuntu.com, then
    # thirty-eight in the Qt install, then forty-seven back in apt again. Two
    # unrelated hosts on the same runner, which is what says it was the machine
    # rather than either mirror. Note what this deliberately is *not*: a retry
    # around apt, or a swap to a different mirror. Making a flaky download
    # tolerant is the habit docs/PORTING.md's Known gaps argues against; this
    # only converts a hang into a failure that can be re-run in a minute.
    #
    # One of those three stalls cannot happen any more: the Qt install is gone,
    # since the toolkit now comes from vcpkg like every other dependency.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-26 rather than an older image because the bundle icon is
          # compiled from app/icons/xpcog.icon, and an Icon Composer package
          # needs actool from Xcode 26. This is not about staying green --
          # app/CMakeLists.txt checks actool's version and falls back to the
          # committed .icns, so older runners build fine. It is about CI
          # exercising the icon that ships instead of the one that does not.
          - name: macOS
            os: macos-26
            preset: macos-debug
          - name: Linux
            os: ubuntu-24.04
            preset: linux-debug
          - name: Windows
            os: windows-2022
            preset: windows-debug

    steps:
      - uses: actions/checkout@v4

      # Two groups here. The build tools proper, and then the command-line
      # *encoders*, which the test suite shells out to for its fixtures.
      #
      # Without the encoders those tests skip, and a skip is not a failure: the
      # run stays green while the gapless seam, seeking, cue spans and tag
      # reading go untested. Sixteen tests were skipping on every platform.
      #
      # nasm is for ffmpeg's assembly. vcpkg downloads it itself on Windows but
      # expects the package manager to supply it everywhere else, so without it
      # the ffmpeg port fails during configure rather than during the build.
      #
      # libwxgtk3.2-dev is the toolkit, and it is an apt package rather than a
      # vcpkg feature on purpose. vcpkg's wxwidgets port depends on its gtk3
      # port, so asking vcpkg for wx here meant building GTK from source and,
      # under it, glib, pango, cairo, harfbuzz, fontconfig, at-spi2, dbus,
      # libsystemd and seven X11 libraries -- 98 packages for the Linux job
      # against 41 without. Every one of them is already on the runner.
      #
      # That is also where two entries this list used to carry came from, one CI
      # round apart, both for ports nothing in this project asks for: fontconfig
      # built gperf, which wanted autoconf-archive, and further down libxcrypt
      # wanted ltdl development files. ltdl is gone with the tree that needed it,
      # as are libgl1-mesa-dev and libglu1-mesa-dev, which were there for
      # vcpkg's opengl port -- a wxWidgets dependency and nothing else's.
      #
      # **autoconf-archive is back, for a different port.** sentry-native depends
      # on libunwind on Linux, and vcpkg's libunwind is an autotools build that
      # refuses to configure without `autoconf autoconf-archive automake
      # libtoolize` on the system. Three of those four were already here, which
      # is why adding the crash reporter took every Linux job down at once with a
      # message naming a package nobody had asked for: the failure is at vcpkg
      # install time, before a compiler is even detected, so what it looks like
      # is CMake unable to find Ninja.
      #
      # libglib2.0-dev stays, and not for the toolkit: platform/ talks to MPRIS
      # over GDBus, so gio-2.0 is a direct dependency of this project on Linux.
      #
      # What this costs is a wxWidgets version that follows Ubuntu rather than
      # vcpkg -- 3.2 here, 3.3 on macOS and Windows. Nothing in the source uses an
      # API newer than 3.1.6, so the gap is theoretical today, and this job is what
      # keeps it that way.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config autoconf autoconf-archive automake libtool nasm \
            libwxgtk3.2-dev libglib2.0-dev \
            flac vorbis-tools opus-tools lame wavpack ffmpeg

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ninja pkg-config autoconf automake libtool nasm
          brew install flac vorbis-tools opus-tools lame wavpack ffmpeg

      # The same encoders on Windows, from their upstream releases at pinned
      # versions. No package manager on the runners carries the set dependably:
      # Chocolatey has nothing trustworthy for flac or lame, and winget is not
      # usable non-interactively here.
      #
      # Worth knowing why this arrives only now: until the fixture commands
      # stopped assuming a POSIX shell, installing encoders on Windows would
      # have changed nothing. `2>/dev/null` fails outright under cmd.exe -- it
      # names a file in a directory that does not exist -- and every call site
      # read that failure as "encoder missing", so the tests skipped either way.
      #
      # Directories go on PATH rather than the executables being collected into
      # one: flac.exe needs libFLAC.dll beside it, so copying the bare .exe
      # produces a binary that cannot start, which looks exactly like a missing
      # encoder all over again.
      #
      # A failed download fails the job on purpose. A dead mirror that quietly
      # degraded to sixteen skips is the precise failure mode this whole step
      # exists to end.
      - name: Install Windows encoders
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $urls = @(
            'https://github.com/xiph/flac/releases/download/1.5.0/flac-1.5.0-win.zip',
            'https://github.com/dbry/WavPack/releases/download/5.9.0/wavpack-5.9.0-x64.zip',
            'https://archive.mozilla.org/pub/opus/win32/opus-tools-0.2-opus-1.3.1.zip',
            'https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-essentials_build.zip',
            # Mirrored, not because the upstream host went away but because it
            # stopped being reachable from Azure-hosted runners. On 2026-08-24
            # eight attempts across two runs were refused while the same URLs
            # served a developer machine at HTTP 200 in under two seconds, so
            # the files are there and the route is not -- which retrying cannot
            # fix and waiting will not either.
            #
            # The assets are byte-for-byte copies; ci-encoders-1 records the
            # upstream URLs and both SHA-256s. Re-point at rarewares.org if it
            # ever becomes reachable again, but there is nothing to gain by it:
            # a GitHub release is the host the other four already use and the
            # one these runners demonstrably reach.
            'https://github.com/losnoco/XPCog/releases/download/ci-encoders-1/lame3.100.1-x64.zip',
            'https://github.com/losnoco/XPCog/releases/download/ci-encoders-1/oggenc2.88-1.3.7-x64.zip'
          )
          # oggenc2.exe is oggenc; the tests invoke it under the portable name.
          $wanted = 'flac.exe','metaflac.exe','wavpack.exe','opusenc.exe','ffmpeg.exe','lame.exe','oggenc.exe','oggenc2.exe'
          $root = Join-Path $env:RUNNER_TEMP 'encoders'
          New-Item -ItemType Directory -Force $root | Out-Null
          # Five third-party hosts now, plus this repository's own release for
          # the two that were unreachable. Any one of them having a slow morning
          # still fails the whole Windows job with nothing wrong in the tree,
          # which is why the retry below exists -- but the failure that actually
          # happened twice was not a slow morning, and is now mirrored rather
          # than retried at.
          #
          # Retried rather than tolerated. Skipping an encoder that would not
          # download turns a red job into a quietly smaller test run, which is
          # worse: the suite reports the same pass rate against fewer cases.
          foreach ($url in $urls) {
            $zip = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetFileName($url))
            $got = $false
            foreach ($attempt in 1..4) {
              try {
                Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing -TimeoutSec 120
                $got = $true
                break
              } catch {
                Write-Host "attempt $attempt of 4 for $url failed: $($_.Exception.Message)"
                Start-Sleep -Seconds (5 * $attempt)
              }
            }
            if (-not $got) { throw "could not download $url after 4 attempts" }
            Expand-Archive -Path $zip -DestinationPath (Join-Path $root ([IO.Path]::GetFileNameWithoutExtension($zip))) -Force
          }
          Get-ChildItem $root -Recurse -File -Include 'oggenc2.exe' |
            ForEach-Object { Copy-Item $_.FullName (Join-Path $_.DirectoryName 'oggenc.exe') -Force }
          # Win32 excluded so the 64-bit flac wins; both live in the same zip.
          $dirs = Get-ChildItem $root -Recurse -File -Include $wanted |
            Where-Object { $_.FullName -notmatch '\\Win32\\' } |
            ForEach-Object { $_.DirectoryName } | Sort-Object -Unique
          $dirs | ForEach-Object { Add-Content -Path $env:GITHUB_PATH -Value $_ }
          "on PATH:"; $dirs
      - name: Verify the Windows encoders are runnable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $missing = @()
          foreach ($tool in 'flac','oggenc','opusenc','lame','wavpack','ffmpeg') {
            $found = Get-Command $tool -ErrorAction SilentlyContinue
            if ($found) { "  $tool -> $($found.Source)" } else { $missing += $tool }
          }
          if ($missing) { throw "not on PATH: $($missing -join ', ')" }

      # vcpkg's x64-windows triplet is MSVC-ABI, but MinGW's gcc sits earlier on the
      # runner's PATH and the Ninja generator does not activate the MSVC environment
      # by itself. Without this, CMake picks MinGW and the link fails on
      # MSVC-mangled symbols in the vcpkg libraries.
      - name: Activate MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          runVcpkgInstall: false
          # An overlay port's manifest is also called vcpkg.json, so the action's
          # default '**/vcpkg.json' glob finds ours *and* every port under
          # ports/. Faced with more than one it reads none of them, and the job
          # dies at setup with "A Git commit id for vcpkg's baseline was not
          # found" -- which points at the baseline, which is present and fine.
          # The first overlay port added here took all four jobs down this way.
          vcpkgJsonIgnores: "['**/vcpkg/**', '**/ports/**']"

      # The presets already point VCPKG_BINARY_SOURCES at .vcpkg-cache; this is
      # what makes that directory survive between runs. Without it every job
      # rebuilds every port from source, which is 3m25s of a 4m51s job -- the
      # compile of our own code is 22 seconds of it.
      #
      # Keyed on the manifest, the pinned baseline and the overlay ports, since
      # those are what change which packages are wanted. The restore-key prefix
      # means adding one dependency reuses the archives for all the others: the
      # cache is per-package, not per-manifest.
      #
      # The `-v2-` is a salt. GitHub caches are write-once per key, so a bad
      # entry cannot be overwritten -- only outlived. Bump it to abandon a
      # poisoned key.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-v3-${{ matrix.preset }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ports/**', 'CMakePresets.json') }}
          restore-keys: vcpkg-v3-${{ matrix.preset }}-

      # vcpkg creates this itself, but not if configure fails before it gets
      # that far -- and then the save step warns about a missing path.
      - name: Prepare the binary cache directory
        shell: bash
        run: mkdir -p .vcpkg-cache

      - name: Configure
        id: configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Smoke-test the CLI
        shell: bash
        run: |
          BIN=build/${{ matrix.preset }}/bin
          "$BIN/xpcog-cli" --version
          "$BIN/xpcog-cli" codecs

      # Gated on Configure rather than on the job, and this distinction cost a
      # day of rebuilt ffmpeg.
      #
      # vcpkg installs the ports *during* configure, so that is when the cache
      # becomes complete. `always()` alone also fires when configure itself
      # failed -- and because GitHub caches are write-once per key, the partial
      # directory it stored then became permanent: every later run got an exact
      # hit on it, skipped the save, and rebuilt ffmpeg from source for nothing.
      #
      # `always()` is still wanted so that a compile or test failure does not
      # additionally cost a dependency rebuild; the cache is complete by then.
      # The added condition is only that configure got far enough to fill it.
      - name: Save vcpkg binary cache
        if: >-
          always() && steps.configure.outcome == 'success'
          && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

  system-libs:
    # The other half of the Linux dependency story, and the half nothing else
    # builds. cmake/XPCogSystemDeps.cmake asks pkg-config what the distribution
    # has before vcpkg is asked for anything, and drops the ports it can answer
    # for -- so every call site that library reaches has two ways of being found
    # and the matrix job above only ever exercises one of them. A CONFIG-mode
    # find_package that quietly stops having a system branch, a version floor
    # that stops matching, an imported target named differently on the two paths:
    # none of that is visible from a build that takes everything from vcpkg.
    #
    # ubuntu-24.04 is the right runner for it rather than merely an available
    # one, because it fails two floors and passes the other twelve. TagLib is
    # 1.13.1 there and codecs/taglib needs 2.0 for TagLib::Variant; Catch2 is
    # 3.4.0 and the floor is 3.7.1, below which a skipped test is reported as a
    # failed one. So this single job runs the system path for twelve
    # dependencies and the fallback-to-vcpkg path for those two and for
    # vgmstream, which the runner has no package for at all -- and the fallback
    # is the case that goes wrong quietly, since a floor that stopped rejecting
    # anything would look like a faster build rather than like a bug.
    #
    # It also covers two things no other job can reach: libsidplayfp is the one
    # entry with an *upper* bound (2.6.0 here, inside it; sidplayfp 3.0 changed
    # play() out from under codecs/sid), and a distribution installs the reSIDfp
    # builder header as <sidplayfp/builders/residfp.h> where ports/libsidplayfp
    # installs it flat -- so the __has_include in SidDecoder.cpp is compiled both
    # ways only if this job exists.
    #
    # What it cannot cover is the system branch for vgmstream or for
    # spessasynth-core. Nothing in Debian or Ubuntu packages either -- Arch has
    # both, as AUR -git builds -- so the assertion below is that those two ports
    # are still installed here, and the branches themselves are exercised on a
    # developer machine rather than in CI. That is the trade those entries are
    # worth anyway: they exist for the machine that has the package, and a runner
    # that does not have it can still hold the fallback in place.
    name: Linux (distribution libraries)
    runs-on: ubuntu-24.04
    # See the matrix job above for why.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Three groups, and they are not interchangeable.
      #
      # The first is the toolchain and the toolkit, as in every Linux job here.
      # The second is the encoders the test fixtures are generated with --
      # musepack-tools is new to this job, because mpcenc normally comes from
      # ports/libmpcdec's `tools` feature and that port is not installed here;
      # tests/CMakeLists.txt falls back to PATH, and without the package the
      # Musepack fixtures would skip in the one job meant to exercise them.
      # The third is what this job is about: the -dev packages the substitution
      # is offered. libtag1-dev is in that list deliberately even though it is
      # too old to be used -- being installed and rejected is the case under test.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config autoconf autoconf-archive automake libtool nasm \
            libwxgtk3.2-dev libglib2.0-dev \
            flac vorbis-tools opus-tools lame wavpack ffmpeg musepack-tools \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev \
            libcurl4-openssl-dev libarchive-dev libsqlite3-dev libsoxr-dev \
            libopusfile-dev libwavpack-dev libopenmpt-dev libgme-dev \
            libmpcdec-dev libsidplayfp-dev libadplug-dev libbinio-dev \
            librubberband-dev \
            catch2 libtag1-dev

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          runVcpkgInstall: false
          # See the matrix job: an overlay port's manifest is also a vcpkg.json.
          vcpkgJsonIgnores: "['**/vcpkg/**', '**/ports/**']"

      # A key of its own, because this job wants a different set of archives
      # from the one linux-debug builds -- fourteen packages rather than
      # forty-one. Sharing the prefix would work, the cache being per-package,
      # but it would also mean each job's save step storing the other's misses.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-v3-linux-repo-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ports/**', 'CMakePresets.json') }}
          restore-keys: vcpkg-v3-linux-repo-

      # See the matrix job: vcpkg creates this, but not if configure dies first.
      - name: Prepare the binary cache directory
        run: mkdir -p .vcpkg-cache

      - name: Configure
        id: configure
        run: cmake --preset linux-repo-debug

      # The assertion this job exists for, and it reads vcpkg's own installed
      # tree rather than the summary XPCogSystemDeps.cmake prints. The summary is
      # a message; the tree is what was actually built, so a substitution that
      # silently stopped happening -- a feature moved back under "dependencies",
      # a floor rewritten, a probe that answers ON and installs the port anyway --
      # fails here rather than passing as an unexplained slowdown.
      #
      # Both directions are checked. A port that must be absent because the
      # system supplied it, and a port that must be present because the system
      # did not: taglib and catch2, both below their floors on this runner,
      # vgmstream and spessasynth-core, which no Debian or Ubuntu release
      # packages at all, and the four that are never substituted anywhere
      # because codecs/flac, codecs/vorbis and the overlay ports build against
      # them.
      - name: Check the substitution actually happened
        run: |
          set -u
          installed=build/linux-repo-debug/vcpkg_installed/x64-linux/share
          status=0
          for port in ffmpeg libarchive sqlite3 soxr opus opusfile \
                      wavpack libopenmpt libgme libmpcdec libsidplayfp \
                      adplug libbinio; do
              if [ -d "$installed/$port" ]; then
                  echo "::error::vcpkg built $port, which ubuntu-24.04 supplies -- the system path for it is not working"
                  status=1
              fi
          done
          # curl and openssl moved out of that list and into this one when the
          # crash reporter arrived, and the move is the assertion rather than a
          # weakening of it. sentry-native's transport depends on libcurl as a
          # dependency of the *port*, so vcpkg builds curl and OpenSSL whatever
          # this job decides about ours. Taking the system copy as well would put
          # two libcurls and two OpenSSLs in one process; XPCogSystemDeps.cmake
          # therefore vetoes the curl substitution whenever `sentry` is
          # requested, and what has to be checked is that it actually did.
          for port in curl openssl taglib catch2 vgmstream spessasynth-core \
                      libflac libogg libvorbis zlib; do
              if [ ! -d "$installed/$port" ]; then
                  echo "::error::vcpkg did not build $port, which it must: this runner cannot supply it"
                  status=1
              fi
          done
          echo "vcpkg built $(ls -1 "$installed"/*/vcpkg.spdx.json | wc -l) packages"
          exit $status

      - name: Build
        run: cmake --build --preset linux-repo-debug

      - name: Test
        run: ctest --preset linux-repo-debug

      - name: Smoke-test the CLI
        run: |
          build/linux-repo-debug/bin/xpcog-cli --version
          build/linux-repo-debug/bin/xpcog-cli codecs

      # See the matrix job: gated on configure, not on the job as a whole.
      - name: Save vcpkg binary cache
        if: >-
          always() && steps.configure.outcome == 'success'
          && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

  headless:
    # The engine, codecs, CLI and tests must build with no UI toolkit present at
    # all -- not merely unused. This is the real guarantee behind the layering
    # rule; cmake/CheckNoToolkit.cmake catches includes, whereas this catches a
    # genuine link-time dependency, and it is the job that proved the rule held
    # when the toolkit was swapped.
    #
    # It also stays cheap, which is why `gui` is a vcpkg feature rather than a
    # plain dependency: this job builds no toolkit at all. On Linux that is no
    # longer what keeps GTK out of the build -- the Linux presets leave the
    # feature off too, and take wx from apt -- but it is still what keeps wx
    # itself out of a configuration that links no toolkit.
    name: Headless (no toolkit)
    runs-on: ubuntu-24.04
    # See the matrix job above for why.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config autoconf autoconf-archive automake libtool nasm \
            flac vorbis-tools opus-tools lame wavpack ffmpeg

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          runVcpkgInstall: false
          # An overlay port's manifest is also called vcpkg.json, so the action's
          # default '**/vcpkg.json' glob finds ours *and* every port under
          # ports/. Faced with more than one it reads none of them, and the job
          # dies at setup with "A Git commit id for vcpkg's baseline was not
          # found" -- which points at the baseline, which is present and fine.
          # The first overlay port added here took all four jobs down this way.
          vcpkgJsonIgnores: "['**/vcpkg/**', '**/ports/**']"

      # A key of its own, unlike before. Under Qt this job shared the Linux
      # job's, because Qt was not a vcpkg dependency and dropping it changed what
      # we built rather than what vcpkg built. wxWidgets *is* one, and this job
      # omits the `gui` feature, so the two jobs genuinely want different package
      # sets and sharing a key would have each of them evicting the other's.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-v3-linux-headless-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ports/**', 'CMakePresets.json') }}
          restore-keys: vcpkg-v3-linux-headless-

      # vcpkg creates this itself, but not if configure fails before it gets
      # that far -- and then the save step warns about a missing path.
      - name: Prepare the binary cache directory
        shell: bash
        run: mkdir -p .vcpkg-cache

      # One preset, no -D. This step used to be `--preset linux-debug -D
      # XPCOG_BUILD_APP=OFF`, and that stopped being enough when the crash
      # reporter arrived: XPCOG_BUILD_APP=OFF means platform/ is never added and
      # nothing links sentry, but the feature list is what vcpkg installs from,
      # so the job built crashpad -- and libunwind under it -- for a target that
      # could not use either. A feature cannot be subtracted by overriding, so
      # `linux-headless` restates the list without it, exactly as macos-headless
      # restates without `gui`. The list stays in CMakePresets.json: one list, in
      # one file.
      #
      # Worth keeping the reason the old override's quotes were load-bearing,
      # because the next person to add a -D of a CMake list will meet it: a CMake
      # list separator is a semicolon and so is a shell statement separator, so
      # unquoted this ran `cmake ... -D VCPKG_MANIFEST_FEATURES=ffmpeg` and then
      # tried to execute `vgmstream`, `mgba` and the rest as commands. vcpkg
      # dutifully installed the ffmpeg feature alone, and the configure died much
      # later at `find_package(libmpcdec)` in codecs/musepack -- a missing port,
      # with nothing anywhere near it mentioning quoting.
      - name: Configure without a toolkit
        id: configure
        run: cmake --preset linux-headless

      - name: Build
        run: cmake --build --preset linux-headless

      - name: Test
        run: ctest --preset linux-headless

      - name: Smoke-test the CLI
        run: |
          build/linux-headless/bin/xpcog-cli --version
          build/linux-headless/bin/xpcog-cli codecs

      # See the matrix job: gated on configure, not on the job as a whole.
      - name: Save vcpkg binary cache
        if: >-
          always() && steps.configure.outcome == 'success'
          && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

  installer:
    # The Windows installer, built the way it would ship rather than merely
    # proved to compile.
    #
    # It is a job of its own and not a step on the Windows matrix entry, for the
    # reason packaging/windows/CMakeLists.txt prints as a status line: a Debug
    # tree links the debug CRT and the debug wx DLLs, neither of which may be
    # redistributed, so an installer built from one fails on any machine without
    # Visual Studio. The matrix job is a Debug tree because that is what runs the
    # test suite. This one is RelWithDebInfo because that is what a person
    # downloads.
    #
    # `windows-app-release` rather than `windows-release`: the CLI and the three
    # test binaries are built by the matrix job and left out of the installer by
    # Harvest.cmake's allowlist anyway, so building them here would be link time
    # spent on files that get skipped and reported. vcpkg installs the same
    # packages either way -- XPCOG_BUILD_CLI and XPCOG_BUILD_TESTS are ours, not
    # features -- which is what makes the cache key below able to fall back on
    # the matrix job's.
    #
    # This runs on pull requests too, and not only on main. Packaging breaks in
    # ways compiling does not: an asset directory that stopped being staged, a
    # DLL applocal no longer copies, an NSIS section referring to a file the
    # harvest no longer finds. All of those are invisible to every other job here
    # and none of them is worth discovering at release time.
    name: Windows installer
    runs-on: windows-2022
    # See the matrix job above for why.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # See the matrix job: MinGW's gcc sits earlier on the runner's PATH and the
      # Ninja generator does not activate the MSVC environment by itself.
      - name: Activate MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # NSIS, from negrutiu's fork rather than from whatever the runner image
      # happens to carry.
      #
      # The image does have an official NSIS today, and it would build an
      # installer. Two reasons not to leave it at that. That NSIS emits a 32-bit
      # installer and only that -- packaging/windows/CMakeLists.txt sets out what
      # the difference is worth, and probes for the fork on a developer machine
      # for the same reason -- and a runner image is a moving target for the tool
      # that decides what people download. `installer` is not a target that fails
      # when makensis is missing; it is a target that does not exist, because the
      # CMake file returns early on purpose so that a developer without NSIS gets
      # a working build rather than a configure failure. In CI that absence would
      # arrive a quarter of an hour later as `ninja: unknown target 'installer'`.
      #
      # Pinned to a release, like the encoder downloads above and for the same
      # reason: the compiler that builds what people download changes when this
      # file says it does. Bump it against
      # https://github.com/negrutiu/nsis/releases. `@v3` and not `@v2` because
      # the `version` input arrived in v3; on v2 it would be ignored and this
      # would silently track whatever `latest` is.
      #
      # `arch` is the compiler's own bitness and not the installer's -- either
      # build emits either stub. It matters here for where the files land: amd64
      # installs to Program Files, leaving the image's official NSIS alone in
      # Program Files (x86), and packaging/windows/CMakeLists.txt looks in that
      # order. The architecture of what ships is the script's `Target` line, and
      # the check after Configure is what confirms it.
      - name: Install NSIS
        uses: negrutiu/nsis-install@v3
        with:
          distro: negrutiu
          version: v3.13.7497.330
          arch: amd64

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          runVcpkgInstall: false
          # See the matrix job: an overlay port's manifest is also a vcpkg.json.
          vcpkgJsonIgnores: "['**/vcpkg/**', '**/ports/**']"

      # Two restore keys, and the second one is the point. `windows-app-release`
      # asks vcpkg for exactly the package set `windows-debug` does -- same
      # triplet, same feature list, and the x64-windows triplet builds each port
      # in both configurations regardless -- so the matrix job's cache is a
      # complete answer for this one. Without the fallback the first run on any
      # manifest change would build all forty-one ports from source for a second
      # time in the same workflow.
      #
      # It still saves under a key of its own rather than sharing one, so that
      # neither job's save step is storing the other's misses.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-v3-windows-app-release-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ports/**', 'CMakePresets.json') }}
          restore-keys: |
            vcpkg-v3-windows-app-release-
            vcpkg-v3-windows-debug-

      # See the matrix job: vcpkg creates this, but not if configure dies first.
      - name: Prepare the binary cache directory
        shell: bash
        run: mkdir -p .vcpkg-cache

      # The Last.fm credentials, and this is the only job that gets them.
      #
      # Through the environment rather than `-D`, which app/CMakeLists.txt
      # supports for the reason it gives there: a -D lands in CMakeCache.txt and
      # outlives the run that supplied it. Reading the environment leaves nothing
      # behind and keeps the value off the command line the log echoes.
      #
      # What this does *not* do is hide the key. It is compiled into XPCog.exe,
      # which is the whole point of a client API key and exactly what Cog does;
      # anyone who can download this installer can read it out of the binary. The
      # secrets exist so that the key is not in a public git history where it
      # gets scraped and revoked, not because the shipped program keeps it.
      #
      # Set them as repository secrets named LASTFM_API_KEY and LASTFM_API_SECRET
      # (Settings -> Secrets and variables -> Actions), from the application
      # registered at https://www.last.fm/api/account/create. A build without
      # them still succeeds: every line of the scrobbling code compiles and the
      # preferences pane reports the feature as unavailable. That is why the
      # check below exists rather than a build failure being relied on.
      - name: Configure
        id: configure
        shell: bash
        env:
          XPCOG_LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          XPCOG_LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: cmake --preset windows-app-release 2>&1 | tee configure.log

      # Asserted from the configure output rather than from the secret being
      # non-empty, because those are different claims. A secret that is set but
      # holds a trailing newline, a key without its matching secret, a rename of
      # either cache variable: all of them leave the workflow looking correct and
      # produce an installer whose Last.fm pane says the feature is not available
      # in this build. The status line app/CMakeLists.txt prints is the build's
      # own account of what it did, so that is what gets read.
      #
      # Skipped for pull requests from forks, where GitHub withholds secrets by
      # design. Those runs package an installer without scrobbling, which is the
      # correct outcome and not a failure -- the packaging is what they are
      # testing.
      - name: Check the Last.fm credentials were baked in
        if: github.event.pull_request.head.repo.fork != true
        shell: bash
        run: |
          if ! grep -q "Last.fm: API key configured" configure.log; then
              echo "::error::configure reports no Last.fm API key. Set the LASTFM_API_KEY and LASTFM_API_SECRET repository secrets; see the Configure step for what they are."
              exit 1
          fi
          echo "Last.fm credentials reached the build."

      # The other half of what Configure decided, and it is asserted here rather
      # than assumed because the failure is silent by construction: find_program
      # would happily pick the image's official NSIS, the amd64 probe would come
      # back negative, and the job would go green having built a 32-bit
      # installer. Which works -- that is the whole trouble with it.
      - name: Check the installer will be 64-bit
        shell: bash
        run: |
          if ! grep -q "64-bit installer" configure.log; then
              echo "::error::configure did not choose a 64-bit installer. $(grep -i 'XPCog: NSIS' configure.log || echo 'no NSIS line in the configure log at all')"
              exit 1
          fi
          grep "XPCog: NSIS" configure.log

      - name: Build
        run: cmake --build --preset windows-app-release

      # Named explicitly because `installer` is deliberately not part of ALL.
      - name: Build the installer
        run: cmake --build --preset windows-app-release --target installer

      # if-no-files-found: error, because the harvest and makensis both report
      # what they skipped on stdout and a green job with no setup.exe in it is
      # the one way this could fail quietly.
      #
      # The .exe is unsigned, as the local build's is. Windows SmartScreen will
      # say so to anyone who runs it.
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: XPCog-windows-x64-installer
          path: build/windows-app-release/XPCog-*-x64-setup.exe
          if-no-files-found: error

      # See the matrix job: gated on configure, not on the job as a whole.
      - name: Save vcpkg binary cache
        if: >-
          always() && steps.configure.outcome == 'success'
          && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
